<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Rio Liu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- rounded square background (same shape family as the dbq logo) -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="23" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.35"/>

  <!-- terminal prompt: > _ -->
  <path d="M34 44 L64 64 L34 84" fill="none" stroke="#5eead4" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 86 H100" stroke="#4ade80" stroke-width="10" stroke-linecap="round"/>
</svg>
