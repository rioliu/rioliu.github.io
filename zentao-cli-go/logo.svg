<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="zentao-cli-go">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- comment bubble -->
  <rect x="22" y="26" width="84" height="58" rx="14" fill="url(#body)"/>
  <path d="M42 82 v18 l17 -18 z" fill="#0d9488"/>

  <!-- terminal prompt: chevron and cursor bar -->
  <path d="M46 44 l12 11 -12 11" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="65" y="61" width="20" height="7" rx="3.5" fill="#0f172a"/>
</svg>
